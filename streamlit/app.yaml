command: ["streamlit", "run", "app.py"]
env:
  # Modified 2026-09-21: real values live here because this app deploys from Git
  # and app.yaml ships with the source, so it overrides anything set elsewhere.
  # This repository is public: treat every value below as world-readable and keep
  # credentials, tokens and hostnames out of it.
  #
  # Empty GOVERNANCE_CATALOGS means no catalog filter, for reads AND writes. With
  # writes enabled below, Grant/Revoke reaches every catalog the app service
  # principal can manage. Narrow it by listing catalogs, e.g. "catalog1".
  - name: GOVERNANCE_CATALOGS
    value: ""
  # Only these emails see the write controls. Matched case-insensitively against
  # the X-Forwarded-Email header from the Databricks Apps proxy.
  - name: GOVERNANCE_ADMIN_EMAILS
    value: "minh18052003@gmail.com"
  - name: GOVERNANCE_ENABLE_WRITES
    value: "true"
  # Both must stay "false" on Databricks Apps.
  - name: GOVERNANCE_LOCAL
    value: "false"
  - name: GOVERNANCE_DEMO
    value: "false"
