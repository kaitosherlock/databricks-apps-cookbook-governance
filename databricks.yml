# Databricks Asset Bundle for the Unity Catalog Governance app.
#
# There is one source tree (governance-app/) and one deployment entry point.
# The workspace host is intentionally NOT hard-coded: this repository is public.
# Supply it per machine with one of:
#   databricks auth login --host https://<workspace>.cloud.databricks.com
#   databricks bundle deploy -t dev --var="workspace_host=https://<workspace>.cloud.databricks.com"
#   $env:DATABRICKS_HOST = "https://<workspace>.cloud.databricks.com"

bundle:
  name: unity-catalog-governance

variables:
  workspace_host:
    description: Workspace URL, e.g. https://my-workspace.cloud.databricks.com
    default: ""
  app_name:
    description: Databricks Apps name for the governance app.
    default: uc-governance

targets:
  # `mode` is deliberately left unset so the app keeps the exact name above;
  # `mode: development` would prefix resource names per user.
  dev:
    default: true
    workspace:
      host: ${var.workspace_host}
    resources:
      apps:
        uc_governance:
          name: ${var.app_name}
          description: Quản trị Unity Catalog - metadata, quyền truy cập, thẻ, chính sách.
          source_code_path: ./governance-app

  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
    resources:
      apps:
        uc_governance:
          name: ${var.app_name}
          description: Quản trị Unity Catalog - metadata, quyền truy cập, thẻ, chính sách.
          source_code_path: ./governance-app
